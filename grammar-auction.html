<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Grammar Auction</title>
<meta name="description" content="لعبة مزاد الجمل لطلاب الصف الثامن: المضارع البسيط والمستمر، وعائلة الماضي" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&family=DM+Mono:wght@500&family=Tajawal:wght@500;700&display=swap" />
<style>
  /* Game-show stage: deep navy under a gold spotlight, saturated team colors. Built to pop on a projector and on camera. */
  :root {
    --bg: #0b1040;
    --bg-2: #1a2380;
    --surface: rgba(255,255,255,.07);
    --surface-2: rgba(255,255,255,.12);
    --line: rgba(255,255,255,.18);
    --text: #ffffff;
    --ink-soft: #b8c0ff;
    --card: #ffffff;
    --card-ink: #111647;
    --card-soft: #5b628f;
    --gold: #ffc933;
    --gold-2: #ff9f1c;
    --gold-soft: #fff1c2;
    --gavel: #ff4757;
    --win: #1fd36b;
    --win-deep: #0e9f4d;
    --win-soft: #d5f8e3;
    --loss: #ff3b4a;
    --loss-soft: #ffe0e3;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, "Consolas", monospace;
    --ar: "Tajawal", "Tahoma", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 70% 45% at 50% -8%, rgba(255,201,51,.28), transparent 70%),
      radial-gradient(ellipse 50% 40% at 0% 100%, rgba(255,61,139,.22), transparent 70%),
      radial-gradient(ellipse 50% 40% at 100% 100%, rgba(45,140,255,.25), transparent 70%),
      radial-gradient(circle at 50% 30%, var(--bg-2), var(--bg) 70%);
    background-color: var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 400 16px/1.5 var(--body);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.5px);
    background-size: 46px 46px;
    mask-image: linear-gradient(to bottom, #000, transparent 60%);
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 16px; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .ar { font-family: var(--ar); direction: rtl; unicode-bidi: isolate; }

  /* Header */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand h1 {
    margin: 0; font: 400 clamp(26px, 4.2vw, 42px)/1 var(--display); letter-spacing: .02em;
    background: linear-gradient(180deg, #fff6d6 0%, var(--gold) 45%, var(--gold-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #7a3d00) drop-shadow(0 0 18px rgba(255,201,51,.45));
  }
  .brand h1 span { background: linear-gradient(180deg, #ffd1e2, #ff3d8b); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 0 #7a0033); }
  .lotcount { font: 400 14px var(--display); color: var(--card-ink); background: var(--gold); padding: 6px 12px; border-radius: 999px; letter-spacing: .06em; box-shadow: 0 0 20px rgba(255,201,51,.5); }
  .lotcount:empty { display: none; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tool { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700; backdrop-filter: blur(6px); }
  .tool:hover:not(:disabled) { background: rgba(255,255,255,.2); }
  .tool.armed { background: var(--loss); border-color: var(--loss); }

  /* Bank / scoreboard */
  .bank { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .acct {
    position: relative; border-radius: 16px; padding: 12px 16px 14px; display: grid; gap: 2px; color: #fff;
    background: linear-gradient(145deg, color-mix(in srgb, var(--team) 100%, #fff 12%), color-mix(in srgb, var(--team) 70%, #000 30%));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.35);
    transition: transform .25s cubic-bezier(.2,1.4,.4,1), box-shadow .25s;
  }
  .acct.active { transform: translateY(-4px) scale(1.03); box-shadow: 0 0 0 4px var(--gold), 0 0 30px rgba(255,201,51,.6), 0 10px 24px rgba(0,0,0,.4); }
  .acct .nm { font: 400 15px var(--display); letter-spacing: .04em; overflow-wrap: anywhere; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .acct .bal { font: 400 clamp(26px, 3.4vw, 38px)/1.1 var(--display); font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .acct .bal.broke { color: #ffd0d4; }
  .acct .delta { position: absolute; top: 10px; right: 12px; font: 400 16px var(--display); padding: 2px 10px; border-radius: 8px; animation: pop 2.4s ease forwards; }
  .delta.up { color: #053b1c; background: var(--win); box-shadow: 0 0 16px var(--win); }
  .delta.down { color: #fff; background: var(--loss); box-shadow: 0 0 16px var(--loss); }
  @keyframes pop { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 12% { opacity: 1; transform: scale(1.15); } 20% { transform: none; } 82% { opacity: 1; } 100% { opacity: 0; } }

  /* Stage */
  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: clamp(16px, 3vw, 34px); display: grid; gap: 22px; position: relative; overflow: hidden; backdrop-filter: blur(8px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .eyebrow { font: 700 13px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .eyebrow .serial { color: var(--card-ink); background: var(--gold); padding: 3px 9px; border-radius: 6px; }
  .announce { font: 400 clamp(22px, 3.4vw, 38px)/1.15 var(--display); margin: 0; text-wrap: balance; color: var(--gold); text-shadow: 0 3px 0 #7a3d00, 0 0 24px rgba(255,201,51,.45); }

  .lot {
    border-radius: 20px; padding: clamp(20px, 3.4vw, 40px); background: var(--card); color: var(--card-ink); position: relative;
    border: 5px solid var(--gold);
    box-shadow: 0 0 0 8px rgba(255,201,51,.18), 0 0 50px rgba(255,201,51,.35), 0 24px 50px rgba(0,0,0,.45);
  }
  .lot.enter { animation: rise .55s cubic-bezier(.2,1.3,.4,1) both; }
  .lot.shake { animation: shake .55s ease both; border-color: var(--loss); box-shadow: 0 0 0 8px rgba(255,59,74,.2), 0 0 60px rgba(255,59,74,.5), 0 24px 50px rgba(0,0,0,.45); }
  .lot.glow-ok { border-color: var(--win); box-shadow: 0 0 0 8px rgba(31,211,107,.2), 0 0 60px rgba(31,211,107,.55), 0 24px 50px rgba(0,0,0,.45); }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes shake { 0%,100% { transform: none; } 15% { transform: translateX(-14px) rotate(-1deg); } 30% { transform: translateX(12px) rotate(1deg); } 45% { transform: translateX(-9px); } 60% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .lot .sentence { font: 800 clamp(28px, 4.8vw, 56px)/1.2 var(--body); margin: 0; text-wrap: balance; }
  mark { background: var(--gold-soft); color: var(--card-ink); padding: 0 .14em; border-radius: 6px; box-shadow: inset 0 -.18em 0 var(--gold); }
  .blank { display: inline-block; min-width: 3.4em; border-bottom: 5px solid var(--card-ink); text-align: center; color: var(--win-deep); }
  .hint { font-weight: 700; color: var(--card-soft); font-size: .6em; }

  .stamp {
    position: absolute; top: -16px; right: 18px; transform: rotate(-8deg); z-index: 2;
    font: 400 clamp(20px, 3vw, 34px)/1 var(--display); letter-spacing: .04em; padding: 8px 16px;
    border-radius: 12px; color: #fff; border: 4px solid #fff;
    animation: slam .4s cubic-bezier(.2,1.7,.4,1) both;
  }
  .stamp.ok { background: var(--win); color: #053b1c; box-shadow: 0 0 30px var(--win); }
  .stamp.bad { background: var(--loss); box-shadow: 0 0 30px var(--loss); }
  .stamp.sold { background: var(--gavel); box-shadow: 0 0 30px var(--gavel); }
  @keyframes slam { from { transform: rotate(-8deg) scale(3); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }

  .trap { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #7c1dff, #ff3d8b); color: #fff; font: 400 14px var(--display); letter-spacing: .06em; padding: 5px 12px; border-radius: 8px; box-shadow: 0 0 20px rgba(255,61,139,.6); animation: wobble 1.4s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.06); } }

  .fix { display: grid; gap: 6px; }
  .fix .label { font: 700 12px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
  .fix .right { font: 800 clamp(22px, 3.2vw, 34px)/1.25 var(--body); color: var(--win); margin: 0; text-shadow: 0 0 20px rgba(31,211,107,.35); }
  .why { font-size: 19px; margin: 0; max-width: 65ch; }
  .why b { color: var(--gold); }
  .why.ar { font-size: 20px; color: var(--ink-soft); }

  /* Bidding panel */
  .panel { display: grid; gap: 14px; border-top: 1px dashed var(--line); padding-top: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row .lbl { font: 700 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); min-width: 110px; }
  .teambtn {
    border: 3px solid var(--team); background: rgba(255,255,255,.06); color: #fff; border-radius: 14px; padding: 9px 16px; font: 400 16px var(--display); letter-spacing: .03em;
    display: inline-flex; gap: 8px; align-items: center; transition: transform .15s;
  }
  .teambtn:hover:not(:disabled) { transform: translateY(-2px); }
  .teambtn .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--team); }
  .teambtn[aria-pressed="true"] { background: var(--team); box-shadow: 0 0 22px var(--team); transform: scale(1.06); }
  .teambtn[aria-pressed="true"] .dot { background: #fff; }
  .money-in { display: inline-flex; align-items: center; border: 3px solid var(--gold); border-radius: 14px; background: var(--card); color: var(--card-ink); overflow: hidden; }
  .money-in span { padding: 0 2px 0 12px; font: 400 22px var(--display); color: var(--gold-2); }
  .money-in input { border: 0; width: 130px; font: 400 26px var(--display); padding: 7px 10px 7px 4px; background: transparent; color: var(--card-ink); font-variant-numeric: tabular-nums; }
  .money-in input:focus { outline: none; }
  .money-in:focus-within { box-shadow: 0 0 0 4px rgba(255,201,51,.4); }
  .chip { border: 2px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 14px; font: 400 15px var(--display); color: #fff; }
  .chip:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .chip.allin { background: linear-gradient(135deg, var(--gold), var(--gold-2)); border-color: transparent; color: var(--card-ink); box-shadow: 0 0 16px rgba(255,201,51,.5); }
  .err { color: #ff8a93; font-weight: 700; min-height: 1.5em; margin: 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .big {
    font: 400 clamp(18px, 2.3vw, 24px)/1 var(--display); letter-spacing: .03em; padding: 15px 26px; border-radius: 14px;
    border: 0; background: linear-gradient(180deg, #4b5cff, #2f3bd6); color: #fff; box-shadow: 0 5px 0 #1a2190, 0 10px 24px rgba(0,0,0,.35);
    transition: transform .08s;
  }
  .big:hover:not(:disabled) { filter: brightness(1.1); }
  .big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #1a2190; }
  .big.gavel { background: linear-gradient(180deg, #ff6b78, var(--gavel)); box-shadow: 0 5px 0 #a3172a, 0 0 28px rgba(255,71,87,.45); }
  .big.gavel:active:not(:disabled) { box-shadow: 0 1px 0 #a3172a; }
  .big.gold { background: linear-gradient(180deg, #ffe07a, var(--gold) 50%, var(--gold-2)); color: var(--card-ink); box-shadow: 0 5px 0 #a35f00, 0 0 28px rgba(255,201,51,.55); animation: pulse 1.6s ease-in-out infinite; }
  .big.gold:active:not(:disabled) { box-shadow: 0 1px 0 #a35f00; }
  @keyframes pulse { 50% { box-shadow: 0 5px 0 #a35f00, 0 0 46px rgba(255,201,51,.9); } }
  .ghost { background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 11px 16px; font-weight: 800; color: #fff; }
  .ghost:hover:not(:disabled) { border-color: var(--ink-soft); background: var(--surface); }

  .clock { font: 400 32px var(--display); font-variant-numeric: tabular-nums; min-width: 3ch; color: var(--gold); text-shadow: 0 0 16px rgba(255,201,51,.6); }
  .clock.low { color: var(--loss); text-shadow: 0 0 16px var(--loss); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .result { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 21px; font-weight: 700; }
  .result strong { font: 400 28px var(--display); padding: 4px 14px; border-radius: 10px; }
  .result .up { color: #053b1c; background: var(--win); box-shadow: 0 0 24px rgba(31,211,107,.6); }
  .result .down { color: #fff; background: var(--loss); box-shadow: 0 0 24px rgba(255,59,74,.6); }

  /* Setup */
  .setup { display: grid; gap: 24px; grid-template-columns: 1.1fr 1fr; }
  @media (max-width: 760px) { .setup { grid-template-columns: 1fr; } }
  .setup h2 { font: 400 clamp(30px, 5vw, 54px)/1.05 var(--display); margin: 0; text-wrap: balance; }
  .setup h2 em { font-style: normal; color: var(--gold); text-shadow: 0 0 24px rgba(255,201,51,.55); }
  .rules { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .rules li { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
  .rules .n { font: 400 16px var(--display); color: var(--card-ink); background: var(--gold); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; box-shadow: 0 0 14px rgba(255,201,51,.5); }
  .rules p { margin: 0; }
  .rules .ar { color: var(--ink-soft); }
  .form { display: grid; gap: 16px; align-content: start; background: var(--card); color: var(--card-ink); border-radius: 20px; padding: 20px; border: 4px solid var(--gold); box-shadow: 0 0 40px rgba(255,201,51,.3); }
  .form label { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--card-soft); display: block; margin-bottom: 6px; }
  .names { display: grid; gap: 8px; }
  .names .nrow { display: flex; align-items: center; gap: 8px; }
  .names .sw { width: 18px; height: 18px; border-radius: 50%; background: var(--team); flex: none; box-shadow: 0 0 10px var(--team); }
  .names input, .form input[type=number] { width: 100%; font: 700 17px var(--body); padding: 9px 12px; border: 2px solid #dde0f5; border-radius: 10px; background: #f5f6ff; color: var(--card-ink); color-scheme: light; }
  .seg { display: inline-flex; border: 2px solid #dde0f5; border-radius: 12px; overflow: hidden; }
  .seg button { border: 0; background: #f5f6ff; padding: 8px 20px; font: 400 20px var(--display); color: var(--card-ink); }
  .seg button[aria-pressed="true"] { background: var(--card-ink); color: var(--gold); }

  .packs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .packbtn { display: grid; gap: 2px; text-align: left; border: 2px solid #dde0f5; background: #f5f6ff; color: var(--card-ink); border-radius: 12px; padding: 10px 12px; }
  .packbtn b { font: 400 15px var(--display); }
  .packbtn .ar { font-size: 14px; color: var(--card-soft); text-align: right; }
  .packbtn[aria-pressed="true"] { background: var(--card-ink); border-color: var(--card-ink); color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
  .packbtn[aria-pressed="true"] .ar { color: #c9ceff; }

  /* Final */
  .final-head { display: grid; gap: 8px; }
  .final-head h2 {
    margin: 0; font: 400 clamp(34px, 6vw, 68px)/1 var(--display); letter-spacing: .02em;
    background: linear-gradient(180deg, #fff3b0, var(--gold) 40%, #ff5a1f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #7a1f00) drop-shadow(0 0 26px rgba(255,120,30,.7));
    animation: flicker 2.2s ease-in-out infinite;
  }
  @keyframes flicker { 50% { filter: drop-shadow(0 4px 0 #7a1f00) drop-shadow(0 0 40px rgba(255,120,30,1)); } }
  .fteams { display: grid; gap: 10px; }
  .fteam { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--team); box-shadow: inset 6px 0 0 var(--team); }
  .fteam .nm { font: 400 17px var(--display); min-width: 130px; flex: 1 1 130px; padding-left: 6px; }
  .fteam .money-in input { width: 110px; font-size: 20px; }
  .fteam .money-in span { font-size: 18px; }
  .mark { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 14px; font-weight: 800; color: #fff; }
  .mark.ok[aria-pressed="true"] { background: var(--win); border-color: var(--win); color: #053b1c; box-shadow: 0 0 18px var(--win); }
  .mark.bad[aria-pressed="true"] { background: var(--loss); border-color: var(--loss); box-shadow: 0 0 18px var(--loss); }

  /* End */
  .end { text-align: center; justify-items: center; position: relative; z-index: 1; }
  .end .crown {
    font: 400 clamp(34px, 6.5vw, 76px)/1.05 var(--display); margin: 0; text-wrap: balance;
    background: linear-gradient(180deg, #fff6d6, var(--gold) 45%, var(--gold-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #7a3d00) drop-shadow(0 0 30px rgba(255,201,51,.7));
  }
  .end .winner { font: 400 clamp(26px, 4.4vw, 46px)/1.1 var(--display); margin: 0; }
  .end .wamt { font: 400 clamp(34px, 6vw, 64px) var(--display); color: var(--win); text-shadow: 0 0 30px rgba(31,211,107,.7); }
  .podium { width: 100%; max-width: 580px; display: grid; gap: 10px; text-align: left; }
  .podium .p { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; color: #fff;
    background: linear-gradient(135deg, var(--team), color-mix(in srgb, var(--team) 65%, #000 35%)); box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .podium .p:first-child { box-shadow: 0 0 0 4px var(--gold), 0 0 30px rgba(255,201,51,.55); }
  .podium .p b { font: 400 18px var(--display); }
  .podium .rk { font: 400 20px var(--display); opacity: .85; }
  .podium .v { font: 400 22px var(--display); font-variant-numeric: tabular-nums; }
  .bills { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bill { position: absolute; top: -40px; width: 60px; height: 30px; border-radius: 4px; background: linear-gradient(135deg, #b6f5cf, #5fe39a); border: 2px solid var(--win-deep); color: #064d24; font: 400 11px/26px var(--display); text-align: center; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(1000px) rotate(540deg); opacity: .2; } }

  /* Confetti burst on a correct CHECK */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetti i { position: absolute; left: 50%; top: 40%; width: 10px; height: 16px; border-radius: 2px; animation: burst 1.6s cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 49; box-shadow: inset 0 0 160px 40px var(--loss); animation: fade 1s ease forwards; }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }

  footer { font-size: 13px; color: var(--ink-soft); text-align: center; }

  @media (max-width: 640px) { .lot:has(.stamp) { margin-top: 18px; } .stamp { top: -22px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    .bills, .confetti { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Grammar <span>Auction</span></h1>
      <div class="lotcount" id="lotcount"></div>
    </div>
    <div class="tools">
      <button class="tool" id="undoBtn" type="button" title="تراجع عن آخر خطوة">↶ Undo</button>
      <button class="tool" id="fsBtn" type="button">⛶ Full screen</button>
      <button class="tool" id="soundBtn" type="button" aria-pressed="true">🔊 Sound</button>
      <button class="tool" id="resetBtn" type="button">New game</button>
    </div>
  </header>

let flashes = {};

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => "$" + Number(n).toLocaleString("en-US");

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
function snapshot() { history.push(JSON.stringify(state)); if (history.length > 60) history.shift(); }

/* ---------- Sound (Web Audio, starts only after a click) ---------- */
let actx = null;
function tone(freq, dur, type = "sine", gain = .25, when = 0) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  gavel() { tone(140, .18, "square", .3); tone(90, .25, "sine", .4, .02); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, "triangle", .2, i * .09)); },
  lose() { tone(220, .35, "sawtooth", .15); tone(160, .5, "sawtooth", .15, .25); },
  tick() { tone(880, .05, "square", .08); },
};

/* ---------- Game flow ---------- */
function newGame() {
  const n = setupDraft.count;
  state = {
    pack: setupDraft.pack, phase: "lot", lot: 0, start: setupDraft.start,
    teams: Array.from({ length: n }, (_, i) => ({ name: (setupDraft.names[i] || DEFAULT_NAMES[i]).trim() || DEFAULT_NAMES[i], money: setupDraft.start, color: TEAM_COLORS[i] })),
    bid: { team: null, amount: 100 }, result: null,
    final: null,
  };
  history = [];
  shown = [];
  render();
}

function sell() {
  const { team, amount } = state.bid;
  const t = state.teams[team];
  if (team == null || !(amount > 0) || amount > t.money) return;
  snapshot();
  stopClock();
  state.phase = "sold";
  sfx.gavel();
  render();
}

function check(noBids) {
  snapshot();
  const lot = lots()[state.lot];
  if (noBids) {
    state.result = { team: null, delta: 0 };
  } else {
    const { team, amount } = state.bid;
    const delta = lot.ok ? amount : -amount;
    state.teams[team].money += delta;
    flashes[team] = delta;
    state.result = { team, delta };
    lot.ok ? sfx.win() : sfx.lose();
  }
  stopClock();
  state.phase = "reveal";
  render();
  if (!noBids) lot.ok ? confetti() : flashBad();
}

function nextLot() {
  snapshot();
  state.lot += 1;
  state.result = null;
  state.bid = { team: null, amount: 100 };
  if (state.lot >= lots().length) {
    state.phase = "final";
    state.final = { stakes: state.teams.map((t) => t.money), marks: state.teams.map(() => null), revealed: false, settled: false };
  } else {
    state.phase = "lot";
  }
  render();
}

function settleFinal() {
  snapshot();
  const f = state.final;
  let anyWin = false;
  state.teams.forEach((t, i) => {
    const stake = Math.min(Math.max(0, f.stakes[i] || 0), t.money);
    if (!stake || f.marks[i] == null) return;
    const delta = f.marks[i] ? stake : -stake;
    t.money += delta; flashes[i] = delta; if (delta > 0) anyWin = true;
  });
  f.settled = true;
  anyWin ? sfx.win() : sfx.lose();
  render();
  anyWin ? confetti() : flashBad();
}

/* ---------- Bidding clock ---------- */
function startClock(sec = 20) {
  stopClock(); clockLeft = sec; paintClock();
  clockTimer = setInterval(() => {
    clockLeft -= 1; paintClock();
    if (clockLeft <= 5 && clockLeft > 0) sfx.tick();
    if (clockLeft <= 0) { stopClock(); sfx.gavel(); }
  }, 1000);
}
function stopClock() { clearInterval(clockTimer); clockTimer = null; }
function paintClock() {
  const el = $("clock"); if (!el) return;
  el.textContent = clockLeft > 0 ? clockLeft + "s" : "Time!";
  el.classList.toggle("low", clockLeft <= 5);
}

/* ---------- Rendering ---------- */
function highlight(s, words) {
  let out = esc(s);
  (words || []).forEach((w) => {
    const re = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
    out = out.replace(re, "<mark>$&</mark>");
  });
  return out;
}

function renderBank() {
  const bank = $("bank");
  if (!state) { bank.innerHTML = ""; bank.hidden = true; return; }
  bank.hidden = false;
  const activeTeam = (state.phase === "lot" || state.phase === "sold") ? state.bid.team : state.result && state.result.team;
  const prev = shown.slice();
  bank.innerHTML = state.teams.map((t, i) => {
    const d = flashes[i];
    return `<div class="acct${activeTeam === i ? " active" : ""}" style="--team:${t.color}">
      <div class="nm">${esc(t.name)}</div>
      <div class="bal${t.money <= 0 ? " broke" : ""}" data-bal="${i}">${money(prev[i] != null ? prev[i] : t.money)}</div>
      ${d ? `<div class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${money(Math.abs(d))}</div>` : ""}
    </div>`;
  }).join("");
  flashes = {};
  state.teams.forEach((t, i) => countUp(bank.querySelector(`[data-bal="${i}"]`), prev[i] != null ? prev[i] : t.money, t.money));
  shown = state.teams.map((t) => t.money);
}

const reduced = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, from, to) {
  if (!el || from === to || reduced()) { if (el) el.textContent = money(to); return; }
  const t0 = performance.now(), dur = 900;
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = money(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function confetti() {
  if (reduced()) return;
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#ffc933", "#ff3d8b", "#2d8cff", "#1fd36b", "#a259ff", "#ffffff"];
  box.innerHTML = Array.from({ length: 90 }, () => {
    const a = Math.random() * Math.PI * 2, d = 200 + Math.random() * 520;
    return `<i style="background:${colors[Math.floor(Math.random() * colors.length)]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d * .8 + 260}px;--r:${Math.random() * 900 - 450}deg;animation-delay:${Math.random() * .15}s"></i>`;
  }).join("");
  document.body.appendChild(box); setTimeout(() => box.remove(), 2000);
}
function flashBad() {
  if (reduced()) return;
  const f = document.createElement("div"); f.className = "flash";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1100);
}

function renderHeader() {
  $("footTopic").textContent = pack().name;
  const lc = $("lotcount");
  if (!state) lc.textContent = "";
  else if (state.phase === "final") lc.textContent = `Round ${total()} of ${total()} · Final`;
  else if (state.phase === "end") lc.textContent = "Auction closed";
  else lc.textContent = `Lot ${String(state.lot + 1).padStart(2, "0")} of ${total()}`;
  $("undoBtn").disabled = !history.length;
  $("resetBtn").hidden = !state;
}

  const saved = load();

    <div style="display:grid;gap:18px;align-content:start">
      <div class="eyebrow"><span class="serial">No. GA-0815</span> ${pack().tag}</div>
      <h2>Every team gets <em>${money(d.start)}</em>. Buy only the sentences you trust.</h2>
      <ol class="rules">
        <li><span class="n">1</span><p>A sentence goes up for auction. Teams bid Grammar Money on it.<br><span class="ar">تُعرض جملة، والفرق تزايد عليها.</span></p></li>
        <li><span class="n">2</span><p>The highest bid buys it. Then: <b>CHECK!</b><br><span class="ar">أعلى مزايدة تشتري الجملة، ثم نكشف.</span></p></li>
        <li><span class="n">3</span><p>Correct sentence: win the bid as profit. Wrong sentence: lose it.<br><span class="ar">الجملة الصحيحة = ربح المبلغ، والخاطئة = خسارته.</span></p></li>
        <li><span class="n">4</span><p>Watch out for <b>Trap Cards</b>. Last round is <b>Double or Nothing</b>.<br><span class="ar">انتبهوا لبطاقات الفخ! والجولة الأخيرة: ضاعف أو اخسر.</span></p></li>
      </ol>
    </div>
    <form class="form" id="setupForm">
      <div>
        <label>Grammar topic</label>
        <div class="packs" role="group">${Object.entries(PACKS).map(([id, p]) => `<button type="button" class="packbtn" data-pack="${id}" aria-pressed="${d.pack === id}"><b>${p.name}</b><span class="ar">${p.ar}</span></button>`).join("")}</div>
      </div>
      <div>
        <label>Number of teams</label>
        <div class="seg" role="group">${[2, 3, 4].map((n) => `<button type="button" data-count="${n}" aria-pressed="${d.count === n}">${n}</button>`).join("")}</div>
      </div>
      <div>
        <label>Team names</label>
        <div class="names">${Array.from({ length: d.count }, (_, i) => `<div class="nrow" style="--team:${TEAM_COLORS[i]}"><span class="sw"></span><input id="tname${i}" data-name="${i}" value="${esc(d.names[i])}" maxlength="24" aria-label="Team ${i + 1} name" /></div>`).join("")}</div>
      </div>
      <div>
        <label for="startCash">Starting Grammar Money</label>
        <input type="number" id="startCash" min="100" step="100" value="${d.start}" />
      </div>
      <div class="actions">
        <button class="big gavel" type="submit">Open the auction</button>
        ${saved && saved.phase !== "end" ? `<button class="ghost" type="button" id="resumeBtn">Resume saved game</button>` : ""}
      </div>
    </form>
  </div>`;
}

function renderLot() {
  const lot = lots()[state.lot];
  const sold = state.phase === "sold";
  const { team, amount } = state.bid;
  const t = team != null ? state.teams[team] : null;
  const over = t && amount > t.money;
  const canSell = t && amount > 0 && !over;
  return `
    <div class="eyebrow"><span class="serial">Lot ${String(state.lot + 1).padStart(2, "0")}</span> Is this sentence correct?</div>
    <p class="announce">${sold ? `Sold to ${esc(t.name)} for ${money(amount)}!` : "Auction starts! How much are you willing to pay?"}</p>
    <div class="lot">
      ${sold ? `<div class="stamp sold">SOLD</div>` : ""}
      <p class="sentence">${esc(lot.s)}</p>
    </div>
    ${sold ? `
      <div class="actions">
        <button class="big gold" id="checkBtn" type="button">🔍 CHECK!</button>
        <span class="ar" style="color:var(--ink-soft)">اسألي الصف أولًا: صحيحة أم خاطئة؟ ولماذا؟</span>
      </div>` : `
      <div class="panel">
        <div class="row"><span class="lbl">Highest bid</span>
          ${state.teams.map((tm, i) => `<button type="button" class="teambtn" style="--team:${tm.color}" data-team="${i}" aria-pressed="${team === i}" ${tm.money <= 0 ? "disabled" : ""}><span class="dot"></span>${esc(tm.name)}</button>`).join("")}
        </div>
        <div class="row"><span class="lbl">Amount</span>
          <label class="money-in"><span>$</span><input id="bidAmt" type="number" inputmode="numeric" min="0" step="50" value="${amount || ""}" aria-label="Bid amount" /></label>
          ${[100, 200, 300, 500].map((v) => `<button type="button" class="chip" data-amt="${v}">${v}</button>`).join("")}
          <button type="button" class="chip allin" data-amt="all" ${t ? "" : "disabled"}>ALL IN</button>
        </div>
        <p class="err" id="bidErr">${over ? `${esc(t.name)} only has ${money(t.money)}.` : ""}</p>
        <div class="actions">
          <button class="big gavel" id="sellBtn" type="button" ${canSell ? "" : "disabled"}>🔨 SOLD!</button>
          <button class="ghost" id="clockBtn" type="button">⏱ 20s clock</button>
          <span class="clock" id="clock" aria-live="polite"></span>
          <button class="ghost" id="noBidBtn" type="button" style="margin-left:auto">No bids · reveal</button>
        </div>
      </div>`}`;
}

function renderReveal() {
  const lot = lots()[state.lot];
  const r = state.result;
  const t = r.team != null ? state.teams[r.team] : null;
  const last = state.lot === lots().length - 1;
  return `
    <div class="eyebrow"><span class="serial">Lot ${String(state.lot + 1).padStart(2, "0")}</span> Check! ${lot.trap ? `<span class="trap">😈 TRAP CARD</span>` : ""}</div>
    <div class="lot ${lot.ok ? "glow-ok" : "shake"}">
      <div class="stamp ${lot.ok ? "ok" : "bad"}">${lot.ok ? "✓ CORRECT" : "✗ WRONG"}</div>
      <p class="sentence">${highlight(lot.s, lot.sig)}</p>
    </div>
    ${lot.ok ? "" : `<div class="fix"><span class="label">Correction</span><p class="right">${highlight(lot.fix, lot.sig)}</p></div>`}
    <div class="fix">
      <p class="why">${lot.why}</p>
      <p class="why ar">${esc(lot.ar)}</p>
    </div>
    <div class="result">
      ${t ? `<span>${esc(t.name)} paid ${money(Math.abs(r.delta))} →</span>
             <strong class="${r.delta > 0 ? "up" : "down"}">${r.delta > 0 ? "+" + money(r.delta) + " profit" : "−" + money(-r.delta) + " lost"}</strong>`
          : `<span>Nobody bought this lot.</span>`}
    </div>
    <div class="actions">
      <button class="big" id="nextBtn" type="button">${last ? "🔥 Final round: Double or Nothing" : "Next lot →"}</button>
    </div>`;
}

function renderFinal() {
  const f = state.final;
  return `
    <div class="final-head">
      <div class="eyebrow"><span class="serial">Lot ${total()}</span> Final round</div>
      <h2>DOUBLE OR NOTHING!</h2>
      <p class="ar" style="margin:0;color:var(--ink-soft)">كل فريق يختار المبلغ الذي يراهن عليه. إجابة صحيحة = يتضاعف المبلغ، إجابة خاطئة = يخسره.</p>
    </div>
    <div class="lot">
      ${f.revealed ? `<div class="stamp ok">ANSWER</div>` : ""}
      <p class="sentence">${f.revealed ? pack().final.answerHtml : pack().final.html}</p>
    </div>
    ${f.revealed ? `<div class="fix"><p class="why">${pack().final.why}</p><p class="why ar">${esc(pack().final.ar)}</p></div>` : ""}
    <div class="fteams">
      ${state.teams.map((t, i) => {
        const broke = t.money <= 0 && !f.settled;
        return `<div class="fteam" style="--team:${t.color}">
          <span class="nm">${esc(t.name)}</span>
          ${broke ? `<span style="color:var(--loss);font-weight:700">Out of money</span>` : `
          <label class="money-in"><span>$</span><input id="stake${i}" type="number" min="0" step="50" data-stake="${i}" value="${f.stakes[i]}" aria-label="${esc(t.name)} stake" ${f.settled ? "disabled" : ""} /></label>
          <button type="button" class="chip allin" data-allin="${i}" ${f.settled ? "disabled" : ""}>ALL IN</button>
          <button type="button" class="mark ok" data-mark="${i}:1" aria-pressed="${f.marks[i] === true}" ${f.settled ? "disabled" : ""}>✓ Right</button>
          <button type="button" class="mark bad" data-mark="${i}:0" aria-pressed="${f.marks[i] === false}" ${f.settled ? "disabled" : ""}>✗ Wrong</button>`}
        </div>`;
      }).join("")}
    </div>
    <div class="actions">
      ${f.revealed ? "" : `<button class="big gold" id="revealFinalBtn" type="button">🔍 Show the answer</button>`}
      ${f.settled
        ? `<button class="big gavel" id="endBtn" type="button">🏆 Crown the Grammar Millionaires</button>`
        : `<button class="big" id="settleBtn" type="button" ${f.marks.some((m) => m != null) ? "" : "disabled"}>💰 Pay out</button>`}
    </div>`;
}

function renderEnd() {
  const ranked = state.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.money - a.money);
  const top = ranked[0].money;
  const winners = ranked.filter((t) => t.money === top);
  const bills = Array.from({ length: 22 }, () =>
    `<div class="bill" style="left:${Math.random() * 96}%;animation-duration:${3 + Math.random() * 3}s;animation-delay:${Math.random() * 1.5}s">G$ ${[100, 500, 1000][Math.floor(Math.random() * 3)]}</div>`).join("");
  return `
    <div class="bills" aria-hidden="true">${bills}</div>
    <div class="end" style="display:grid;gap:14px">
      <div class="eyebrow">Auction closed · Final balances</div>
      <p class="crown">🏆 THE GRAMMAR MILLIONAIRES</p>
      <p class="winner">${winners.map((w) => esc(w.name)).join(" & ")}</p>
      <div class="wamt">${money(top)}</div>
      <div class="podium">
        ${ranked.map((t, k) => `<div class="p" style="--team:${t.color}"><span class="rk">#${k + 1}</span><b>${esc(t.name)}</b><span class="v">${money(t.money)}</span></div>`).join("")}
      </div>
      <div class="actions" style="justify-content:center">
        <button class="big gavel" id="againBtn" type="button">Play again</button>
      </div>
    </div>`;
}

function render() {
  renderHeader();
  renderBank();
  const stage = $("stage");
  if (!state) stage.innerHTML = renderSetup();
  else if (state.phase === "lot" || state.phase === "sold") stage.innerHTML = renderLot();
  else if (state.phase === "reveal") stage.innerHTML = renderReveal();
  else if (state.phase === "final") stage.innerHTML = renderFinal();
  else stage.innerHTML = renderEnd();
  const key = !state ? "setup" : (state.phase === "sold" ? "lot" : state.phase) + state.lot;
  if (key !== lastKey && state && state.phase === "lot") { const l = stage.querySelector(".lot"); if (l) l.classList.add("enter"); }
  if (key !== lastKey && lastKey !== null) { try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (err) {} }
  lastKey = key;
  if (state) save();
  if (clockTimer) paintClock();
}

/* Update bid controls without re-rendering the input the teacher is typing in. */
function refreshBidUI() {
  const { team, amount } = state.bid;
  const t = team != null ? state.teams[team] : null;
  const over = t && amount > t.money;
  $("bidErr").textContent = over ? `${t.name} only has ${money(t.money)}.` : "";
  $("sellBtn").disabled = !(t && amount > 0 && !over);
  document.querySelectorAll("[data-team]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.team === team)));
  const allin = document.querySelector('[data-amt="all"]'); if (allin) allin.disabled = !t;
  renderBank();
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.id !== "resetBtn") disarmReset();

  if (b.dataset.count) { setupDraft.count = +b.dataset.count; $("stage").innerHTML = renderSetup(); return; }
  if (b.dataset.pack) { setupDraft.pack = b.dataset.pack; render(); return; }
  if (b.id === "resumeBtn") { state = load(); state.pack = state.pack || "present"; state.teams.forEach((t, i) => { t.color = TEAM_COLORS[i]; }); history = []; shown = []; render(); return; }

  if (b.dataset.team != null && state) { state.bid.team = +b.dataset.team; refreshBidUI(); return; }
  if (b.dataset.amt) {
    const t = state.teams[state.bid.team];
    state.bid.amount = b.dataset.amt === "all" ? (t ? t.money : 0) : +b.dataset.amt;
    $("bidAmt").value = state.bid.amount; refreshBidUI(); return;
  }
  if (b.id === "sellBtn") return sell();
  if (b.id === "noBidBtn") return check(true);
  if (b.id === "clockBtn") { sfx.tick(); return startClock(20); }
  if (b.id === "checkBtn") return check(false);
  if (b.id === "nextBtn") return nextLot();

  if (b.dataset.allin != null) { const i = +b.dataset.allin; state.final.stakes[i] = state.teams[i].money; render(); return; }
  if (b.dataset.mark) {
    const [i, v] = b.dataset.mark.split(":"); const val = v === "1";
    state.final.marks[+i] = state.final.marks[+i] === val ? null : val; render(); return;
  }
  if (b.id === "revealFinalBtn") { snapshot(); state.final.revealed = true; sfx.gavel(); render(); return; }
  if (b.id === "settleBtn") return settleFinal();
  if (b.id === "endBtn") { snapshot(); state.phase = "end"; sfx.win(); render(); confetti(); return; }
  if (b.id === "againBtn") { state = null; history = []; try { localStorage.removeItem(KEY); } catch (err) {} render(); return; }

  if (b.id === "fsBtn") {
    try { const d = document; (d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen()).catch(() => {}); } catch (err) {}
    return;
  }
  if (b.id === "undoBtn" && history.length) { stopClock(); state = JSON.parse(history.pop()); render(); return; }
  if (b.id === "soundBtn") { sound = !sound; b.setAttribute("aria-pressed", String(sound)); b.textContent = sound ? "🔊 Sound" : "🔇 Muted"; return; }
  if (b.id === "resetBtn") {
    if (b.classList.contains("armed")) { disarmReset(); stopClock(); state = null; history = []; try { localStorage.removeItem(KEY); } catch (err) {} render(); }
    else { b.classList.add("armed"); b.textContent = "Tap again to end game"; }
  }
});
function disarmReset() { const r = $("resetBtn"); r.classList.remove("armed"); r.textContent = "New game"; }

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "bidAmt") { state.bid.amount = Math.max(0, Math.floor(+el.value || 0)); refreshBidUI(); }
  else if (el.dataset.name != null) setupDraft.names[+el.dataset.name] = el.value;
  else if (el.id === "startCash") setupDraft.start = Math.max(100, Math.floor(+el.value || 1000));
  else if (el.dataset.stake != null) {
    const i = +el.dataset.stake; state.final.stakes[i] = Math.min(state.teams[i].money, Math.max(0, Math.floor(+el.value || 0))); save();
  }
});
document.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.id === "setupForm") newGame(); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) { if (e.key === "Enter" && e.target.id === "bidAmt") sell(); return; }
  if (!state) return;
  if (e.key >= "1" && e.key <= "4" && state.phase === "lot" && state.teams[+e.key - 1] && state.teams[+e.key - 1].money > 0) { state.bid.team = +e.key - 1; refreshBidUI(); }
});

/* Keep the game going if the page is live-updated or refreshed mid-lesson. */
function start(data) {
  if (data && data.state) { state = data.state; state.pack = state.pack || "present"; history = data.history || []; }
  render();
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") window.claude.hot.snapshot(() => ({ state, history }));
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
</html>
